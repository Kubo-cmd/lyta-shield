<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f1a"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2cbf"/>
      <stop offset="1" stop-color="#5a189a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" fill="#e0e0ff" font-family="monospace" font-size="20" font-weight="bold">LYTA Shield Output Guard</text>

  <!-- Model box -->
  <rect x="80" y="100" width="160" height="80" rx="12" fill="url(#purple)" filter="url(#glow)"/>
  <text x="160" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">AI Model</text>

  <!-- User box -->
  <rect x="480" y="100" width="160" height="80" rx="12" fill="url(#cyan)" filter="url(#glow)"/>
  <text x="560" y="145" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16">User</text>

  <!-- Guard box -->
  <rect x="260" y="180" width="200" height="100" rx="16" fill="#16162a" stroke="#9d4edd" stroke-width="2" filter="url(#glow)"/>
  <text x="360" y="215" text-anchor="middle" fill="#c77dff" font-family="monospace" font-size="16" font-weight="bold">LYTA Shield</text>
  <text x="360" y="240" text-anchor="middle" fill="#e0e0ff" font-family="monospace" font-size="12">rules_engine.py</text>
  <text x="360" y="260" text-anchor="middle" fill="#e0e0ff" font-family="monospace" font-size="12">hermes_guard.py</text>

  <!-- Arrows -->
  <line x1="240" y1="140" x2="260" y2="200" stroke="#9d4edd" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="360" y1="280" x2="360" y2="320" stroke="#00b4d8" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <line x1="460" y1="220" x2="480" y2="140" stroke="#00b4d8" stroke-width="3" marker-end="url(#arrow-cyan)"/>

  <!-- Decision labels -->
  <text x="230" y="185" fill="#c77dff" font-family="monospace" font-size="12">raw output</text>
  <text x="400" y="340" fill="#00b4d8" font-family="monospace" font-size="12">allowed</text>
  <text x="490" y="210" fill="#ff0055" font-family="monospace" font-size="12">blocked</text>

  <!-- Bottom explanation -->
  <text x="360" y="370" text-anchor="middle" fill="#a0a0c0" font-family="monospace" font-size="12">Every assistant message is checked before it reaches the user.</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9d4edd"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#00b4d8"/>
    </marker>
  </defs>
</svg>