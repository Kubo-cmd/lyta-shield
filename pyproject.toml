[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lyta-shield"
version = "1.5.2"
description = "Output guard for AI assistants: detects paste-jacking, remote fetch-to-shell, and browser injection payloads."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LYTA"}
]
keywords = ["security", "ai-safety", "prompt-injection", "output-guard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pynacl>=1.5.0",
]

[project.scripts]
lyta-shield = "lyta_shield:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6.0",
    "build>=1.2.2",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
