name: Adversarial Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rules tests
        run: python3 tests/test_lyta_shield_rules.py
      - name: Run adversarial bypass challenges
        run: python3 tests/test_adversarial_bypass.py
      - name: Verify wrapper is present and executable
        run: |
          test -x integrations/hermes-wrapper.sh
          test -x bin/lyta-shield
          test -x bin/lyta-shield-doctor
      - name: Run doctor
        run: ./bin/lyta-shield-doctor
      - name: Compile integrations
        run: python3 -m py_compile src/*.py tests/*.py integrations/*.py
