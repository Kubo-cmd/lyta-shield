name: LYTA Shield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 0"

jobs:
  rules:
    name: Rules engine tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run core rules tests
        run: python3 -m pytest tests/test_rules.py tests/test_bypass.py -v

      - name: Run standalone rules suite
        run: python3 -m pytest tests/test_lyta_shield_rules.py tests/test_adversarial_bypass.py -v

  adversarial:
    name: Adversarial and doctor checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run rules tests
        run: python3 -m pytest tests/test_lyta_shield_rules.py -v

      - name: Run adversarial bypass challenges
        run: python3 -m pytest tests/test_adversarial_bypass.py -v

      - name: Verify executables are present
        run: |
          test -x integrations/hermes-wrapper.sh
          test -x bin/lyta-shield
          test -x bin/lyta-shield-doctor

      - name: Run doctor
        run: ./bin/lyta-shield-doctor

      - name: Compile Python files
        run: python3 -m py_compile src/*.py tests/*.py integrations/*.py

  simulation:
    name: Simulation fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run simulation fuzz
        run: python3 -m pytest tests/test_simulation.py -v

  performance:
    name: Performance benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run performance benchmark
        run: python3 -m pytest tests/test_performance.py -v

  backup:
    name: Signed backup and key health
    runs-on: ubuntu-latest
    needs: [rules, adversarial]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt pynacl

      - name: Generate backup signing keys
        run: |
          mkdir -p var/keys
          python3 scripts/generate-backup-key.py
          ls -la var/keys

      - name: Check backup key health
        run: python3 scripts/backup-key-health.py

      - name: Run signed backup
        run: python3 scripts/backup-sign.py var/backups

      - name: Verify backup
        run: python3 scripts/verify-backup.py var/backups

      - name: Run backup tests
        run: python3 -m pytest tests/test_backup.py -v

      - name: Debug backup artifacts
        run: ls -la var/backups || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python3 -m ruff check src/ scripts/ tests/
