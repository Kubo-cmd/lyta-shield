name: LYTA Shield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pynacl

      - name: Run rules engine tests
        run: python3 -m pytest tests/test_rules.py tests/test_bypass.py -v

      - name: Run simulation fuzz
        run: python3 -m pytest tests/test_simulation.py -v

  backup:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pynacl

      - name: Generate backup signing keys
        run: |
          mkdir -p var/keys
          python3 scripts/generate-backup-key.py
          ls -la var/keys

      - name: Check backup key health
        run: python3 scripts/backup-key-health.py

      - name: Run signed backup
        run: python3 scripts/backup-sign.py var/backups

      - name: Verify backup
        run: python3 scripts/verify-backup.py var/backups

      - name: Run backup tests
        run: python3 -m pytest tests/test_backup.py -v

      - name: Debug backup artifacts
        run: ls -la var/backups || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check src/ scripts/ tests/ || true
