name: LYTA Shield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 0"

jobs:
  rules:
    name: Rules engine tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-build.lock

      - name: Run complete test suite
        run: python3 -m pytest -q

  adversarial:
    name: Adversarial and doctor checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-build.lock

      - name: Run rules tests
        run: python3 -m pytest tests/test_lyta_shield_rules.py -v

      - name: Run adversarial bypass challenges
        run: python3 -m pytest tests/test_adversarial_bypass.py -v

      - name: Verify executables are present
        run: |
          test -x integrations/hermes-wrapper.sh
          test -x bin/lyta-shield
          test -x bin/lyta-shield-doctor

      - name: Run doctor
        run: ./bin/lyta-shield-doctor

      - name: Compile Python files
        run: python3 -m py_compile src/*.py tests/*.py integrations/*.py

  simulation:
    name: Simulation fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-build.lock

      - name: Run simulation fuzz
        run: python3 -m pytest tests/test_simulation.py -v

  performance:
    name: Performance benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-build.lock

      - name: Run performance benchmark
        run: python3 -m pytest tests/test_performance.py -v

  backup:
    name: Signed backup and key health
    runs-on: ubuntu-latest
    needs: [rules, adversarial]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements-build.lock

      - name: Generate backup signing keys
        run: |
          mkdir -p var/keys
          python3 scripts/generate-backup-key.py
          ls -la var/keys

      - name: Check backup key health
        run: python3 scripts/backup-key-health.py

      - name: Run signed backup
        run: ./bin/lyta-shield backup

      - name: Verify backup
        run: ./bin/lyta-shield verify-backup

      - name: Run backup tests
        run: python3 -m pytest tests/test_backup.py -v

      - name: Debug backup artifacts
        run: ls -la var/backups || true

  packaging:
    name: Wheel packaging and console smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python3 -m pip install --require-hashes -r requirements-build.lock
          python3 -m build --wheel --sdist

      - name: Install and exercise console entry point
        run: |
          python3 -m pip install --no-deps --force-reinstall dist/*.whl
          (cd /tmp && lyta-shield --check 'printf safe')

      - name: Install and exercise source distribution
        run: |
          python3 -m pip install --no-deps --no-build-isolation --force-reinstall dist/*.tar.gz
          (cd /tmp && lyta-shield --check 'printf safe')

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements-build.lock

      - name: Lint
        run: python3 -m ruff check src/ scripts/ integrations/ tests/
